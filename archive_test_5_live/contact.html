    <h2>Formulaire</h2>
    <form class="lead-form" id="contactForm" action="send.php" method="post" novalidate>
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="lead-grid">
        <label>Nom
          <input type="text" name="name" maxlength="80" autocomplete="name" required>
        </label>
        <label>E-mail
          <input type="email" name="email" maxlength="120" autocomplete="email" required>
        </label>
      </div>
      <label>Objet
        <input type="text" name="subject" maxlength="120" required>
      </label>
      <label>Message
        <textarea name="message" rows="6" maxlength="2000" required></textarea>
      </label>
      <label class="check">
        <input type="checkbox" name="consent" value="1" required>
        <span>J’accepte que Bondeskovgaard Cleaning ApS traite mes données pour répondre à mon message. J’ai lu la <a href="privacy.html">confidentialité</a>, les <a href="cookies.html">cookies</a> et les <a href="terms.html">conditions</a>.</span>
      </label>
      <button class="btn btn-main" type="submit" id="contactSubmit">Envoyer</button>
      <p class="form-status" id="contactStatus" role="status" aria-live="polite"></p>
    </form>
